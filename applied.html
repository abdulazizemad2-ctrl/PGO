/* Layout: one exam sheet column — brand header, mode chooser, then a single question card styled like the paper exam table */
:root{
  --navy:#0B004F; --ink:#1B1640; --gray:#383838; --tint:#ECEAF5; --paper:#FBFAFE; --line:#2A2550;
  --hl:#FFE600; --hl-ink:#1B1640; --ok:#0E9F5A; --bad:#E5383B; --muted:#5E5A78; --card:#FFFFFF; --chip-new:#1800AD;
  --f-ar:"Ahlan","Tajawal","Segoe UI",Tahoma,sans-serif;
  --f-num:"Tajawal","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#2B1FA0; --ink:#ECEAF8; --gray:#4A4A55; --tint:#221D45; --paper:#120F26; --line:#8E88C4;
  --hl:#FFE600; --hl-ink:#14112B; --ok:#3DD68C; --bad:#FF6B6E; --muted:#A9A4CC; --card:#1A1636; --chip-new:#9C93FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#2B1FA0; --ink:#ECEAF8; --gray:#4A4A55; --tint:#221D45; --paper:#120F26; --line:#8E88C4;
  --hl:#FFE600; --hl-ink:#14112B; --ok:#3DD68C; --bad:#FF6B6E; --muted:#A9A4CC; --card:#1A1636; --chip-new:#9C93FF; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:820px;margin:0 auto}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.logo{background:#fff;border-radius:12px;padding:6px 10px;display:flex}
.logo img{height:44px;width:auto}
.tag{font-weight:700;color:var(--navy);border:2px solid var(--navy);border-radius:999px;padding:2px 14px;font-size:14px;background:var(--card)}
:root[data-theme="dark"] .tag{color:var(--ink);border-color:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:var(--ink);border-color:var(--line)}}
h1{font-size:clamp(24px,5vw,34px);margin:6px 0 2px;line-height:1.3;text-wrap:balance}
h1 .lat{font-family:var(--f-num);font-weight:800}
.sub{color:var(--muted);margin:0 0 16px}
/* panels */
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px}
.gate{max-width:440px;margin:28px auto;text-align:center;display:grid;gap:12px}
.gate input{font-family:var(--f-num);font-size:20px;text-align:center;letter-spacing:.12em;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);width:100%}
.err{color:var(--bad);min-height:1.6em;font-weight:700}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:700;background:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.hlb{background:var(--hl);color:var(--hl-ink)}
.btn:disabled{opacity:.45;cursor:default}
/* stats strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 18px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-num);font-size:24px;font-weight:800;color:var(--ink)}
.stat span{color:var(--muted);font-size:13px}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* modes */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.mode{text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.mode:hover{border-color:var(--navy);box-shadow:0 0 0 2px var(--tint)}
.mode b{font-size:18px}
.mode small{color:var(--muted);font-size:14px}
.mode .cnt{font-family:var(--f-num);font-weight:800;color:var(--navy);font-size:13px}
:root[data-theme="dark"] .mode .cnt{color:var(--chip-new)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mode .cnt{color:var(--chip-new)}}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;margin:16px 0 6px;align-items:center}
.opts label{display:flex;gap:6px;align-items:center;font-size:15px}
.opts input{width:18px;height:18px;accent-color:var(--navy)}
.secs{display:grid;gap:6px;margin-top:10px}
.secrow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.secrow label{display:flex;gap:8px;align-items:center;min-width:0}
.secrow .meter{width:90px;flex:none;height:8px;border-radius:99px;background:var(--tint);overflow:hidden}
.secrow .meter i{display:block;height:100%;background:var(--ok)}
.chhead{font-weight:700;color:var(--muted);font-size:14px;margin-top:8px}
details summary{cursor:pointer;font-weight:700}
/* quiz bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;display:grid;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.barrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog{height:8px;border-radius:99px;background:var(--tint);overflow:hidden}
.prog i{display:block;height:100%;background:var(--navy);transition:width .25s}
:root[data-theme="dark"] .prog i{background:var(--chip-new)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .prog i{background:var(--chip-new)}}
.pill{font-family:var(--f-num);font-weight:700;border-radius:99px;padding:2px 10px;font-size:14px;border:1.5px solid var(--line)}
.pill.okp{color:var(--ok);border-color:var(--ok)}.pill.badp{color:var(--bad);border-color:var(--bad)}
/* question card = exam table */
.q{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);margin-top:6px}
.qhead{display:flex;align-items:stretch}
.qn{background:var(--navy);color:#fff;font-family:var(--f-num);font-weight:800;min-width:58px;display:grid;place-items:center;font-size:20px}
.qstem{background:var(--tint);padding:14px 16px;flex:1;min-width:0;display:grid;gap:6px}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;border-radius:8px;padding:0 8px;font-size:12px;font-weight:700;line-height:1.7}
.chip.old{background:var(--gray);color:#fff}.chip.new{border:1.5px solid var(--chip-new);color:var(--chip-new)}
.chip.book{background:var(--navy);color:#fff}
.chip.tfk{border:1.5px solid var(--line);color:var(--ink)}
.qtext{font-weight:700;font-size:clamp(17px,2.6vw,20px);line-height:1.65;text-wrap:pretty}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.choices.one{grid-template-columns:1fr}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:right;padding:14px 16px;background:var(--card);border:0;border-top:1.5px solid var(--line);font-size:16.5px;line-height:1.55;min-height:58px}
.choices:not(.one) .choice:nth-child(odd){border-left:1.5px solid var(--line)}
.choice .l{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;border:1.5px solid var(--line);font-size:15px}
.choice:hover:not([disabled]){background:var(--tint)}
.choice.right{background:var(--hl);color:var(--hl-ink);font-weight:700}
.choice.right .l{background:var(--hl-ink);color:var(--hl);border-color:var(--hl-ink)}
.choice.wrong{background:color-mix(in srgb,var(--bad) 16%,var(--card));}
.choice.wrong .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.choice.picked{background:color-mix(in srgb,var(--navy) 14%,var(--card));}
.choice.picked .l{background:var(--navy);color:#fff;border-color:var(--navy)}
.choice[disabled]{cursor:default}
.tfbig .choice{justify-content:center;font-weight:800;font-size:19px}
.verdict{padding:12px 16px;font-weight:700;border-top:1.5px solid var(--line)}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.flag{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:10px 14px}
.flag.on{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
/* results */
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{width:132px;height:132px;flex:none}
.ring text{font-family:var(--f-num);font-weight:800;fill:var(--ink)}
.grade{font-size:22px;font-weight:800}
.bk{display:grid;gap:8px;margin-top:14px}
.bkrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:10px;align-items:center;font-size:14.5px}
.bkrow .meter{height:10px;border-radius:99px;background:var(--tint);overflow:hidden}
.bkrow .meter i{display:block;height:100%}
.rev{display:grid;gap:10px;margin-top:10px}
.rv{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.rv .qtext{font-size:16px}
.rv .ans{margin-top:6px;display:grid;gap:4px;font-size:15px}
.rv .ans .y{background:var(--hl);color:var(--hl-ink);border-radius:6px;padding:1px 8px;font-weight:700;justify-self:start}
.rv .ans .n{color:var(--bad);text-decoration:line-through}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:26px}
.foot a{color:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const DATA = {"secs": [{"ch": "تمهيد: الالتزام القائم ديانة", "t": "الالتزام النظامي والالتزام القائم ديانة"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "الوفاء: الموفي ووفاء الغير"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "رجوع الموفي على المدين"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "شروط الموفي"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "الموفى له"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "إعذار الدائن والإيداع"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "محل الوفاء"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "تعيين الدين الموفى به"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "زمان الوفاء ونظرة الميسرة"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "مكان الوفاء ونفقاته"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "التنفيذ العيني الجبري وشروطه"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "إعذار المدين"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "كيفية التنفيذ العيني الجبري"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "التعويض: حالاته وشروطه وموانعه"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "التعويض الاتفاقي (الشرط الجزائي)"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "ضمانات التنفيذ: الضمان العام والخاص"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "الدعوى غير المباشرة"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "دعوى الصورية"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "دعوى عدم نفاذ تصرفات المدين"}, {"ch": "الفصل الأول: آثار الالتزام", "t": "الحق في حبس المال"}, {"ch": "الفصل الثاني: أوصاف الالتزام", "t": "الشرط: أنواعه وخصائصه"}, {"ch": "الفصل الثاني: أوصاف الالتزام", "t": "آثار الشرط"}, {"ch": "الفصل الثاني: أوصاف الالتزام", "t": "الأجل: أنواعه وخصائصه وآثاره"}], "qs": [{"s": 0, "k": "q", "src": "ك", "q": "سقطت دعوى دين خالد بالتقادم، ثم سدده طوعاً، وبعدها طالب باسترداده. الحكم:", "o": ["لا يحق له الاسترداد، لأن وفاءه بالتزام قائم ديانة صحيح", "يحق له الاسترداد على أساس دفع غير المستحق", "يحق له استرداد نصف المبلغ فقط", "يحق له الاسترداد لأن الالتزام أصبح باطلاً"], "a": 0}, {"s": 0, "k": "q", "src": "ج", "q": "سعد مدين لفهد بدين سقطت دعواه بالتقادم، فقدّم سعد باختياره كفيلاً يضمن الوفاء. فإن الالتزام:", "o": ["يصبح باطلاً لأن التقادم أسقطه", "يبقى قائماً ديانة لا يجوز الإجبار عليه", "يتحول إلى التزام نظامي واجب التنفيذ", "ينقضي بتقديم الكفيل"], "a": 2}, {"s": 0, "k": "q", "src": "ج", "q": "رفع دائن دعوى بدين لا يثبت إلا بالكتابة، ولم يقدم دليلاً كتابياً، فرُفضت وحاز الحكم الحجية، مع أن ذمة المدين مشغولة فعلاً. هذا الالتزام:", "o": ["منقضٍ بالحكم", "قائم ديانة", "نظامي كامل", "باطل بطلاناً مطلقاً"], "a": 1}, {"s": 0, "k": "q", "src": "ج", "q": "دفع المدين دعوى الدائن بحلف اليمين الحاسمة مع أن ذمته مشغولة، ثم ندم ووفّى الدين طوعاً. وفاؤه:", "o": ["باطل لأن اليمين أسقطت الدين", "صحيح، ولا يجوز له استرداده", "تبرع يجوز له الرجوع فيه", "قابل للإبطال لمصلحته"], "a": 1}, {"s": 0, "k": "q", "src": "ج", "q": "أقرّ المدين بدينه بعد سقوط الدعوى به بالتقادم. أثر الإقرار:", "o": ["لا أثر له لأن الدين سقط", "يجعل الدين باطلاً", "يتحول الالتزام القائم ديانة إلى التزام نظامي", "يجعل الدين تبرعاً"], "a": 2}, {"s": 1, "k": "q", "src": "ج", "q": "محمد مدين للبنك، فسدد صديقه علي الدين دون علم محمد. الوفاء:", "o": ["باطل لعدم علم المدين", "موقوف على إجازة محمد", "صحيح ويبرئ ذمة محمد", "صحيح لكنه لا يبرئ ذمة محمد"], "a": 2}, {"s": 1, "k": "q", "src": "ج", "q": "اتفق صاحب منزل مع مهندس مشهور على تصميم منزله، فأرسل المهندس تلميذه ليصممه بدلاً منه. للدائن:", "o": ["قبول الوفاء وجوباً لأن وفاء الغير صحيح", "رفضه فقط إذا اعترض المهندس", "رفض الوفاء، ويكون الوفاء باطلاً", "قبوله إذا كان التلميذ ذا مصلحة"], "a": 2}, {"s": 1, "k": "q", "src": "ج", "q": "شخص لا مصلحة له أراد سداد دين صديقه، فاعترض المدين وأبلغ الدائن باعتراضه، فرفض الدائن الوفاء. هذا الرفض:", "o": ["غير جائز لأن وفاء الغير صحيح ولو بلا مصلحة", "غير جائز إلا بحكم قضائي", "جائز فقط إذا كان الدين نقدياً", "جائز"], "a": 3}, {"s": 1, "k": "q", "src": "ج", "q": "اعترض المدين على وفاء كفيله الشخصي بالدين، وأبلغ الدائن باعتراضه. هل للدائن رفض وفاء الكفيل؟", "o": ["نعم، لأن الكفيل ليس هو المدين", "نعم، لاعتراض المدين وإبلاغه", "لا، إلا إذا كان الدين مؤجلاً", "لا، لأن الكفيل ل /* ---------- gate ---------- */
function gate(){
  app.innerHTML = header() + `
  <h1>الأسئلة التطبيقية الـ <span class="lat">MED</span> لـمادة أحكام الإلتزام</h1>
  <p class="sub">اختبار تفاعلي فيه ${DATA.qs.length} سؤالاً مرتبة حسب فصول الملخص.</p>
  <form class="panel gate" id="gf">
    <label for="code"><b>أدخل رمز الدخول الخاص بالمشتركين</b></label>
    <input id="code" autocomplete="off" inputmode="latin" placeholder="••••••">
    <div class="err" id="gerr"></div>
    <button class="btn" type="submit">دخول</button>
    <small class="sub" style="margin:0">رمز الدخول يصلك مع اشتراكك في الملخص.</small>
  </form>`;
  $("#gf").addEventListener("submit", async e => {
    e.preventDefault();
    const v = $("#code").value.trim().toUpperCase();
    if (await sha(v) === HASH){ store.set("ok", HASH); home(); }
    else { $("#gerr").textContent = "الرمز غير صحيح. تأكد منه وحاول مرة أخرى."; }
  });
}

/* ---------- home ---------- */
function secCount(i){ return DATA.qs.filter(q=>q.s===i).length; }
function secMastery(i){
  const ids = DATA.qs.map((q,k)=>[q,k]).filter(([q])=>q.s===i).map(([,k])=>k);
  const ok = ids.filter(k => stats[k] && stats[k].last===1).length;
  return ids.length ? ok/ids.length : 0;
}
function home(){
  const answered = Object.keys(stats).length;
  const correct = Object.values(stats).filter(s=>s.last===1).length;
  const wrongIds = Object.entries(stats).filter(([,s])=>s.last===0).map(([k])=>+k);
  const flags = store.get("flags", []);
  const old = DATA.qs.filter(q=>q.src==="ت").length;
  let secHtml = "", lastCh = null;
  DATA.secs.forEach((s,i)=>{
    if (s.ch !== lastCh){ secHtml += `<div class="chhead">${esc(s.ch)}</div>`; lastCh = s.ch; }
    const m = Math.round(secMastery(i)*100);
    secHtml += `<div class="secrow"><label><input type="checkbox" class="sc" value="${i}" id="sec${i}"><span>${esc(s.t)} <span class="num" style="color:var(--muted)">(${secCount(i)})</span></span></label><span class="meter" title="إتقانك ${m}%"><i style="width:${m}%"></i></span></div>`;
  });
  app.innerHTML = header() + `
  <h1>الأسئلة التطبيقية الـ <span class="lat">MED</span> لـمادة أحكام الإلتزام</h1>
  <p class="sub">${DATA.qs.length} سؤالاً تطبيقياً (قضايا): ${old} من تجميعات الاختبارات السابقة، و${DATA.qs.filter(q=>q.src==="ك").length} من قضايا الملخص والكتاب، و${DATA.qs.filter(q=>q.src==="ج").length} قضية جديدة بالصيغة نفسها.</p>
  <div class="strip">
    <div class="stat"><b>${answered}</b><span>سؤالاً حللتها</span></div>
    <div class="stat"><b>${answered? Math.round(correct/answered*100):0}%</b><span>نسبة صوابك</span></div>
    <div class="stat"><b>${wrongIds.length}</b><span>سؤالاً أخطأت فيه</span></div>
    <div class="stat"><b>${flags.length}</b><span>سؤالاً علّمته للمراجعة</span></div>
  </div>
  <div class="modes">
    <button class="mode" data-m="full"><b>الاختبار الشامل</b><small>كل الأسئلة بترتيب الملخص من التمهيد إلى آثار الأجل.</small><span class="cnt">${DATA.qs.length} سؤالاً</span></button>
    <button class="mode" data-m="quick"><b>اختبار سريع</b><small>20 سؤالاً عشوائياً من كل المواضيع، مع مؤقت.</small><span class="cnt">20 سؤالاً · 15 دقيقة</span></button>
    <button class="mode" data-m="wrong" ${wrongIds.length?"":"disabled"}><b>راجع أخطائي</b><small>الأسئلة التي أخطأت فيها آخر مرة فقط.</small><span class="cnt">${wrongIds.length} سؤالاً</span></button>
    <button class="mode" data-m="flags" ${flags.length?"":"disabled"}><b>الأسئلة المعلّمة</b><small>الأسئلة التي علّمتها بنجمة أثناء الحل.</small><span class="cnt">${flags.length} سؤالاً</span></button>
  </div>
  <div class="panel" style="margin-top:14px">
    <details id="secd"><summary>اختبار حسب الموضوع</summary>
      <div class="secs">${secHtml}</div>
      <div class="row" style="margin-top:12px"><button class="btn" id="secgo" disabled>ابدأ بالمواضيع المختارة</button><span class="sub num" id="secn" style="margin:0"></span></div>
    </details>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="o-instant" ${store.get("instant",true)?"checked":""}> التصحيح فور الإجابة</label>
    <label><input type="checkbox" id="o-shuf" ${store.get("shuf",false)?"checked":""}> خلط ترتيب الأسئلة</label>
    
  </div>
  <div class="row" style="justify-content:space-between;margin-top:8px">
    <button class="btn ghost" id="reset">مسح سجل تقدمي</button>
  </div>
  <div class="foot">قضايا من تجميعات الطلاب وقنوات مجتمع الحقوق ومن الملخص، وتنسيق ملخصات أبو عماد · <a href="https://t.me/molaksat_aboemad" target="_blank" rel="noopener">قناة التليجرام</a><br><a href="index.html">⬅ اختبار التجميعات والأسئلة العامة</a></div>`;
  ["instant","shuf"].forEach(k => $("#o-"+k).addEventListener("change", e => store.set(k, e.target.checked)));
  app.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => startMode(b.dataset.m)));
  const upd = () => { const sel=[...app.querySelectorAll(".sc:checked")].map(x=>+x.value);
    const n = filterTF(DATA.qs.map((q,k)=>k).filter(k=>sel.includes(DATA.qs[k].s))).length;
    $("#secgo").disabled = !n; $("#secn").textContent = n? n+" سؤالاً" : ""; };
  app.querySelectorAll(".sc").forEach(c=>c.addEventListener("change",upd));
  $("#secgo").addEventListener("click", () => { const sel=[...app.querySelectorAll(".sc:checked")].map(x=>+x.value);
    begin(DATA.qs.map((q,k)=>k).filter(k=>sel.includes(DATA.qs[k].s)), "اختبار حسب الموضوع", 0); });
  const rb = $("#reset"); let armed=false;
  rb.addEventListener("click", () => { if(!armed){ armed=true; rb.textContent="اضغط مرة أخرى لتأكيد المسح"; setTimeout(()=>{armed=false; rb.textContent="مسح سجل تقدمي";},4000); return; }
    stats={}; store.set("stats",{}); store.set("flags",[]); home(); });
}
function filterTF(ids){ return store.get("tf",true) ? ids : ids.filter(k=>DATA.qs[k].k!=="tf"); }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function startMode(m){
  const all = DATA.qs.map((q,k)=>k);
  if (m==="full") begin(all, "الاختبار الشامل", 0);
  if (m==="quick") begin(shuffle(filterTF(all)).slice(0,20), "اختبار سريع", 15*60, true);
  if (m==="wrong") begin(Object.entries(stats).filter(([,s])=>s.last===0).map(([k])=>+k).sort((a,b)=>a-b), "مراجعة الأخطاء", 0);
  if (m==="flags") begin(store.get("flags",[]).slice().sort((a,b)=>a-b), "الأسئلة المعلّمة", 0);
}

/* ---------- session ---------- */
function begin(ids, title, secs, preShuffled){
  ids = filterTF(ids);
  if (store.get("shuf",false) && !preShuffled) ids = shuffle(ids);
  if (!ids.length) return home();
  S = { ids, title, i:0, ans:{}, instant: store.get("instant",true), t0: Date.now(), limit: secs, timer:null, done:false };
  if (secs){ S.timer = setInterval(tick, 1000); }
  render();
}
function tick(){
  const left = S.limit - Math.floor((Date.now()-S.t0)/1000);
  const el = $("#clock"); if (el) el.textContent = fmt(Math.max(0,left));
  if (left <= 0){ finish(); }
}
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function render(){
  const k = S.ids[S.i], q = DATA.qs[k], picked = S.ans[k];
  const answered = picked !== undefined, show = answered && S.instant;
  const okN = Object.entries(S.ans).filter(([kk,v])=>DATA.qs[kk].a===v).length;
  const badN = Object.keys(S.ans).length - okN;
  const flags = store.get("flags", []), fl = flags.includes(k);
  const sec = DATA.secs[q.s];
  const long = q.k==="tf" ? false : q.o.some(o=>o.length>34);
  let ch = q.o.map((o,j)=>{
    let cls = "";
    if (show){ if (j===q.a) cls="right"; else if (j===picked) cls="wrong"; }
    else if (answered && j===picked) cls="picked";
    const lab = q.k==="tf" ? (j===0?"✓":"✗") : LET[j];
    return `<button class="choice ${cls}" data-j="${j}" ${show?"disabled":""}><span class="l">${lab}</span><span>${esc(o)}</span></button>`;
  }).join("");
  let verdict = "";
  if (show){ verdict = picked===q.a ? `<div class="verdict ok">إجابة صحيحة</div>` : `<div class="verdict bad">إجابة خاطئة. الصحيحة مظللة بالأصفر: ${q.k==="tf"? esc(q.o[q.a]) : LET[q.a]+") "+esc(q.o[q.a])}</div>`; }
  const pct = Math.round((Object.keys(S.ans).length)/S.ids.length*100);
  app.innerHTML = `
  <div class="bar">
    <div class="barrow"><button class="btn ghost" id="quit">إنهاء والعودة</button><b>${esc(S.title)}</b>
      <span class="row">${S.instant?`<span class="pill okp num">✓ ${okN}</span><span class="pill badp num">✗ ${badN}</span>`:""}${S.limit?`<span class="pill num" id="clock">${fmt(Math.max(0,S.limit-Math.floor((Date.now()-S.t0)/1000)))}</span>`:""}<span class="pill num">${S.i+1} / ${S.ids.length}</span></span></div>
    <div class="prog"><i style="width:${pct}%"></i></div>
  </div>
  <div class="q">
    <div class="qhead"><div class="qn">${k+1}</div>
      <div class="qstem"><div class="qmeta"><span>${esc(sec.ch)} · ${esc(sec.t)}</span>${q.src==="ت"?'<span class="chip old">تجميعات</span>':q.src==="ك"?'<span class="chip book">من الملخص</span>':'<span class="chip new">جديد</span>'}${q.k==="tf"?'<span class="chip tfk">صح أم خطأ</span>':""}</div>
      <div class="qtext">${esc(q.q)}</div></div></div>
    <div class="choices ${long?"one":""} ${q.k==="tf"?"tfbig":""}">${ch}</div>
    ${verdict}
  </div>
  <div class="nav">
    <button class="btn ghost" id="prev" ${S.i===0?"disabled":""}>السابق</button>
    <button class="flag ${fl?"on":""}" id="flag">${fl?"★ معلّم للمراجعة":"☆ علّمه للمراجعة"}</button>
    ${S.i===S.ids.length-1 ? `<button class="btn hlb" id="fin">إنهاء وعرض النتيجة</button>` : `<button class="btn" id="next">التالي</button>`}
  </div>`;
  app.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => pick(k, +b.dataset.j)));
  $("#quit").addEventListener("click", () => { if (Object.keys(S.ans).length) finish(); else { stop(); home(); } });
  $("#prev")?.addEventListener("click", () => { S.i--; render(); });
  $("#next")?.addEventListener("click", () => { S.i++; render(); });
  $("#fin")?.addEventListener("click", finish);
  $("#flag").addEventListener("click", () => { let f=store.get("flags",[]); f = f.includes(k)? f.filter(x=>x!==k) : [...f,k]; store.set("flags",f); render(); });
}
function pick(k, j){
  if (S.ans[k] !== undefined && S.instant) return;
  S.ans[k] = j;
  if (S.instant) record(k, j);
  render();
  if (!S.instant && S.i < S.ids.length-1){ setTimeout(()=>{ if(S && !S.done){ S.i++; render(); } }, 220); }
}
function record(k, j){
  const ok = DATA.qs[k].a === j ? 1 : 0;
  const st = stats[k] || {c:0,w:0}; ok? st.c++ : st.w++; st.last = ok; stats[k] = st; store.set("stats", stats);
}
function stop(){ if (S && S.timer) clearInterval(S.timer); }
document.addEventListener("keydown", e => {
  if (!S || S.done || !$(".q")) return;
  const map = {"1":0,"2":1,"3":2,"4":3,"أ":0,"ب":1,"ج":2,"د":3};
  if (map[e.key] !== undefined){ const b = app.querySelectorAll(".choice")[map[e.key]]; if (b && !b.disabled) b.click(); }
  if (e.key==="ArrowLeft") $("#next")?.click();
  if (e.key==="ArrowRight") $("#prev")?.click();
});

/* ---------- results ---------- */
function finish(){
  stop(); S.done = true;
  if (!S.instant) Object.entries(S.ans).forEach(([k,j])=>record(+k,j));
  const ids = S.ids, n = ids.length;
  const answered = ids.filter(k=>S.ans[k]!==undefined);
  const ok = answered.filter(k=>S.ans[k]===DATA.qs[k].a).length;
  const pct = answered.length? Math.round(ok/answered.length*100) : 0;
  const grade = pct>=90?"ممتاز، جاهز للاختبار":pct>=75?"جيد جداً، راجع أخطاءك فقط":pct>=60?"جيد، تحتاج مراجعة بعض المواضيع":"تحتاج مراجعة الملخص قبل المحاولة التالية";
  const by = {};
  ids.forEach(k=>{ const s=DATA.qs[k].s; by[s]=by[s]||{n:0,ok:0}; by[s].n++; if(S.ans[k]===DATA.qs[k].a) by[s].ok++; });
  const bk = Object.entries(by).sort((a,b)=>a[0]-b[0]).map(([s,v])=>{ const p=Math.round(v.ok/v.n*100);
    const col = p>=75?"var(--ok)":p>=50?"var(--hl)":"var(--bad)";
    return `<div class="bkrow"><span>${esc(DATA.secs[s].t)}</span><span class="meter"><i style="width:${p}%;background:${col}"></i></span><span class="num">${v.ok}/${v.n}</span></div>`; }).join("");
  const wrong = ids.filter(k=>S.ans[k]!==DATA.qs[k].a);
  const rev = wrong.map(k=>{ const q=DATA.qs[k], p=S.ans[k];
    const lab = j => q.k==="tf"? q.o[j] : LET[j]+") "+q.o[j];
    return `<div class="rv"><div class="qmeta"><span class="num">سؤال ${k+1}</span> · <span>${esc(DATA.secs[q.s].t)}</span></div><div class="qtext">${esc(q.q)}</div>
      <div class="ans">${p===undefined?'<span class="n" style="text-decoration:none">لم تُجب</span>':`<span class="n">إجابتك: ${esc(lab(p))}</span>`}<span class="y">الصحيحة: ${esc(lab(q.a))}</span></div></div>`; }).join("");
  const C = 2*Math.PI*52, off = C*(1-pct/100);
  const ringCol = pct>=75?"var(--ok)":pct>=50?"var(--hl)":"var(--bad)";
  app.innerHTML = header() + `
  <h1>نتيجتك في ${esc(S.title)}</h1>
  <div class="panel score">
    <svg class="ring" viewBox="0 0 132 132" role="img" aria-label="النسبة ${pct}%"><circle cx="66" cy="66" r="52" fill="none" stroke="var(--tint)" stroke-width="14"/><circle cx="66" cy="66" r="52" fill="none" stroke="${ringCol}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 66 66)"/><text x="66" y="74" text-anchor="middle" font-size="28">${pct}%</text></svg>
    <div style="display:grid;gap:4px;min-width:0"><div class="grade">${grade}</div>
      <div class="num">${ok} صحيحة من ${answered.length} أجبت عنها ·  ${answered.length-ok} خاطئة · ${n-answered.length} بلا إجابة</div>
      <div class="sub num" style="margin:0">الوقت: ${fmt(Math.floor((Date.now()-S.t0)/1000))}</div></div>
  </div>
  <div class="panel" style="margin-top:14px"><b>نتيجتك في كل موضوع</b><div class="bk">${bk}</div></div>
  <div class="row" style="margin-top:14px">
    ${wrong.length?`<button class="btn hlb" id="redo">أعد حل الأخطاء (${wrong.length})</button>`:""}
    <button class="btn" id="home">العودة للبداية</button>
  </div>
  ${wrong.length?`<h2 style="margin:22px 0 4px;font-size:20px">مراجعة الأخطاء</h2><div class="rev">${rev}</div>`:`<p class="sub" style="margin-top:16px">لا أخطاء في هذه المحاولة.</p>`}
  <div class="foot">ملخصات أبو عماد · <a href="https://t.me/molaksat_aboemad" target="_blank" rel="noopener">قناة التليجرام</a></div>`;
  $("#home").addEventListener("click", ()=>{ S=null; home(); });
  $("#redo")?.addEventListener("click", ()=>{ const t=S.title; begin(wrong, "إعادة الأخطاء: "+t, 0, true); });
  window.scrollTo(0,0);
}

home();
</script>
